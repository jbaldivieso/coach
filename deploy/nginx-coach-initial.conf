# Initial Nginx configuration for Coach (before SSL)
# Use this first, then run certbot to add SSL
#
# Copy to /etc/nginx/sites-available/coach
# Then: sudo ln -s /etc/nginx/sites-available/coach /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d coach.baldivieso.com

# Client registration (/oauth/register/) is unauthenticated, and each request
# creates a row, so cap how fast any one address can call it
limit_req_zone $binary_remote_addr zone=coach_oauth_register:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name coach.baldivieso.com;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (served directly by Nginx for better performance).
    # Only Vite's hashed assets are safe to cache forever; everything else
    # (index.html, the manifest, the icon, admin assets) is revalidated.
    location /static/ {
        alias /var/www/coach/backend/staticfiles/;
        add_header Cache-Control "no-cache";
    }

    location /static/assets/ {
        alias /var/www/coach/backend/staticfiles/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker lives under /static/ but has to control the app at /
    location = /static/sw.js {
        alias /var/www/coach/backend/staticfiles/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /static/manifest.webmanifest {
        alias /var/www/coach/backend/staticfiles/manifest.webmanifest;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # OAuth discovery documents for the Claude connector. Without this prefix
    # match, the dotfile rule below answers them with a 403.
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth/register/ {
        limit_req zone=coach_oauth_register burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Client upload size limit
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/coach_access.log;
    error_log /var/log/nginx/coach_error.log;
}
